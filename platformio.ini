; PlatformIO – ESP32-C3 (C3FN4/C3FH4, 4 MB) + IIS2ICLX
; SDA=GPIO4 SCL=GPIO5
; RS485: UART0 TX=GPIO21 RX=GPIO20 @ 115200
; USB-CDC: optionaler Debug (SETDEBUG)
; SoftAP-Web-UI + Dual-OTA

[env:esp32-c3]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
board_build.mcu = esp32c3
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_port = COM34
monitor_port = COM34
; Native USB (OTG): Download-Mode per USB-Reset, ohne PROG/RESET-Taster
board_upload.before_reset = usb_reset
board_upload.after_reset = hard_reset
board_upload.wait_for_upload_port = true
; Monitor: DTR/RTS nicht toggeln (sonst Download-Mode / Reset-Loop)
monitor_dtr = 0
monitor_rts = 0

; Serial = USB-CDC; Serial0 = UART0 (RS485)
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D CORE_DEBUG_LEVEL=2

lib_deps =
	links2004/WebSockets@2.4.1

monitor_filters = esp32_exception_decoder, time
