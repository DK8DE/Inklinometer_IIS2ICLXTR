name: Build Webflasher IMGs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webflasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (esp32-c3)
        run: pio run -e esp32-c3

      - name: Prepare flash images
        id: meta
        run: |
          set -euo pipefail
          ENV=esp32-c3
          BUILD_DIR=".pio/build/${ENV}"
          OUT_DIR="IMGs"
          mkdir -p "$OUT_DIR"

          VERSION="$(grep -oP 'FW_VERSION\s*=\s*"\K[^"]+' src/web_ui.cpp | head -n1 || true)"
          if [ -z "$VERSION" ]; then
            VERSION="0.0.0-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Firmware-Version: ${VERSION}"
          export FW_VERSION="${VERSION}"

          BOOT_APP0="$(find ~/.platformio/packages -name 'boot_app0.bin' | head -n1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin nicht gefunden" >&2
            exit 1
          fi

          # App-Image für SoftAP-OTA / esptool ab 0x10000
          cp "$BUILD_DIR/firmware.bin" "$OUT_DIR/firmware.bin"

          # Ein Komplettimage ab Flash-Adresse 0 (Bootloader + Partitionen + App)
          pip install -q esptool
          python -m esptool --chip esp32c3 merge_bin \
            -o "$OUT_DIR/factory.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          # ESP Web Tools: ein Teil = factory.bin @ 0
          python3 - <<'PY'
import json
from pathlib import Path
import os
version = os.environ["FW_VERSION"]
data = {
  "name": "Inklinometer IIS2ICLX",
  "version": version,
  "new_install_prompt_erase": True,
  "builds": [
    {
      "chipFamily": "ESP32-C3",
      "parts": [
        {"path": "factory.bin", "offset": 0}
      ]
    }
  ]
}
Path("IMGs/manifest.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
PY

          # Kurzer Hinweis im Artifact
          cat > "$OUT_DIR/README.txt" <<EOF
Inklinometer IIS2ICLX ${VERSION}

factory.bin  - Komplettflash ab Adresse 0 (esptool / Webflasher)
firmware.bin - nur App fuer SoftAP-OTA (Web-Tab Update)

Beispiel Komplettflash:
  esptool.py --chip esp32c3 write_flash 0x0 factory.bin

Beispiel OTA:
  SoftAP starten -> http://192.168.4.1 -> Update -> firmware.bin
EOF

          # Pages-Bundle
          rm -rf site
          mkdir -p site/IMGs
          cp webflasher/index.html site/index.html
          cp "$OUT_DIR/factory.bin" "$OUT_DIR/firmware.bin" "$OUT_DIR/manifest.json" site/IMGs/
          ls -la IMGs site/IMGs

      - name: Upload flash binaries
        uses: actions/upload-artifact@v4
        with:
          name: Inklinometer-${{ steps.meta.outputs.version }}
          path: |
            IMGs/factory.bin
            IMGs/firmware.bin
            IMGs/README.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
