name: Build Webflasher IMGs

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: webflasher-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_new_release: ${{ steps.meta.outputs.is_new_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini', 'partitions.csv') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware (esp32-c3)
        run: pio run -e esp32-c3

      - name: Prepare flash images
        id: meta
        run: |
          set -euo pipefail
          ENV=esp32-c3
          BUILD_DIR=".pio/build/${ENV}"
          OUT_DIR="IMGs"
          mkdir -p "$OUT_DIR"

          chmod +x scripts/read_version.sh scripts/sync_version.sh
          VERSION="$(./scripts/read_version.sh)"
          ./scripts/sync_version.sh
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Firmware-Version: ${VERSION}"
          export FW_VERSION="${VERSION}"

          TAG="v${VERSION}"
          IS_NEW=0
          if [[ "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ) ]]; then
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              IS_NEW=1
            fi
          fi
          echo "is_new_release=${IS_NEW}" >> "$GITHUB_OUTPUT"
          echo "Release-Tag ${TAG}: neu=${IS_NEW}"

          BOOT_APP0="$(find ~/.platformio/packages -name 'boot_app0.bin' | head -n1)"
          if [ -z "$BOOT_APP0" ]; then
            echo "boot_app0.bin nicht gefunden" >&2
            exit 1
          fi

          cp "$BUILD_DIR/firmware.bin" "$OUT_DIR/firmware.bin"

          pip install -q esptool
          python -m esptool --chip esp32c3 merge_bin \
            -o "$OUT_DIR/factory.bin" \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x0 "$BUILD_DIR/bootloader.bin" \
            0x8000 "$BUILD_DIR/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD_DIR/firmware.bin"

          python3 - <<'PY'
          import json
          from pathlib import Path
          import os
          version = os.environ["FW_VERSION"]
          data = {
            "name": "Inklinometer DK8DE IIS2ICLX",
            "version": version,
            "new_install_prompt_erase": True,
            "builds": [
              {
                "chipFamily": "ESP32-C3",
                "parts": [{"path": "factory.bin", "offset": 0}],
              }
            ],
          }
          Path("IMGs/manifest.json").write_text(
              json.dumps(data, indent=2) + "\n", encoding="utf-8"
          )
          PY

          cat > "$OUT_DIR/README.txt" <<EOF
          Inklinometer DK8DE IIS2ICLX ${VERSION}

          factory.bin  - Komplettflash ab Adresse 0 (esptool / Webflasher)
          firmware.bin - nur App fuer SoftAP-OTA (Web-Tab Update)

          Beispiel Komplettflash:
            esptool.py --chip esp32c3 write_flash 0x0 factory.bin

          Beispiel OTA:
            SoftAP starten -> http://192.168.4.1 -> Update -> firmware.bin
          EOF

          # Versionierte Kopien fuer Release-Assets
          cp "$OUT_DIR/factory.bin" "$OUT_DIR/Inklinometer-${VERSION}-factory.bin"
          cp "$OUT_DIR/firmware.bin" "$OUT_DIR/Inklinometer-${VERSION}-firmware.bin"

          rm -rf site
          mkdir -p site/IMGs
          cp webflasher/index.html site/index.html
          cp "$OUT_DIR/factory.bin" "$OUT_DIR/firmware.bin" "$OUT_DIR/manifest.json" site/IMGs/
          ls -la IMGs site/IMGs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload flash binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Inklinometer-${{ steps.meta.outputs.version }}
          path: |
            IMGs/factory.bin
            IMGs/firmware.bin
            IMGs/Inklinometer-${{ steps.meta.outputs.version }}-factory.bin
            IMGs/Inklinometer-${{ steps.meta.outputs.version }}-firmware.bin
            IMGs/README.txt
          retention-days: 90
          if-no-files-found: error

      - name: Create GitHub Release (nur bei neuer Version)
        if: steps.meta.outputs.is_new_release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          TAG="v${VERSION}"
          gh release create "$TAG" \
            --title "Inklinometer DK8DE IIS2ICLX ${VERSION}" \
            --notes "Firmware ${VERSION} aus \`src/version.h\`.

          - \`Inklinometer-${VERSION}-factory.bin\` – Komplettflash ab 0x0
          - \`Inklinometer-${VERSION}-firmware.bin\` – SoftAP-OTA (App)

          Webflasher: https://dk8de.github.io/Inklinometer_IIS2ICLXTR/" \
            "IMGs/Inklinometer-${VERSION}-factory.bin" \
            "IMGs/Inklinometer-${VERSION}-firmware.bin" \
            "IMGs/README.txt"

      - name: Upload Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
